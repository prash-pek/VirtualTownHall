<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outset Innovation</title>
<meta name="description" content="Outset Innovation. Coming soon.">
<link rel="icon" href="/icon.png" type="image/png">
<meta property="og:title" content="Outset Innovation">
<meta property="og:description" content="Coming soon.">
<meta property="og:image" content="/logo.png">
<meta name="theme-color" content="#345930">
<style>
  :root { --bg: #345930; --mint: #92edc1; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--mint);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.5rem; padding: 2rem 1rem; text-align: center;
  }
  h1 { line-height: 0; }
  h1 img { width: min(560px, 86vw); height: auto; display: block; }
  .tag {
    display: inline-block; padding: .55rem 1.25rem; border: 2px solid var(--mint); border-radius: 999px;
    font-size: .95rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
  }
  footer { position: fixed; bottom: 1.25rem; font-size: .8rem; opacity: .7; }
</style>
</head>
<body>
  <h1><img src="/logo.png" alt="Outset Innovation" width="800" height="406"></h1>
  <p class="tag">Coming soon</p>
  <footer>&copy; 2026 Outset Innovation</footer>
</body>
</html>
